<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hapus Background AI</title>
    <style>
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        background-color: #f0f2f5;
        margin: 0;
        padding: 20px;
      }
      .card {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.08);
        text-align: center;
        max-width: 600px;
        width: 100%;
        margin-bottom: 20px;
      }
      h2 { color: #0d6efd; margin-bottom: 10px; }
      p { color: #6c757d; margin-bottom: 25px; font-size: 15px; }
      
      .btn {
        background-color: #6c757d;
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        display: inline-block;
        transition: 0.3s;
        text-decoration: none;
      }
      .btn:hover { background-color: #5c636a; }
      
      .btn-primary { background-color: #0d6efd; }
      .btn-primary:hover { background-color: #0b5ed7; }
      
      .btn-success { background-color: #198754; width: 100%; box-sizing: border-box; margin-top: 15px; padding: 15px; }
      .btn-success:hover { background-color: #157347; }

      .btn-download { background-color: #ffc107; color: #000; margin-top: 10px; font-size: 14px; padding: 8px 16px; display: inline-block;}
      .btn-download:hover { background-color: #e0a800; }
      
      #fileInput { display: none; }
      
      .info-text { margin-top: 15px; font-size: 15px; color: #333; }
      
      #fileList {
        text-align: left;
        margin-top: 10px;
        font-size: 14px;
        color: #555;
        max-height: 100px;
        overflow-y: auto;
        padding: 10px;
        background-color: #f8f9fa;
        border-radius: 8px;
        border: 1px solid #ddd;
        display: none;
      }
      .file-item { margin-bottom: 5px; }

      #progressContainer {
        display: none;
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
      
      #progressLog {
        text-align: left;
        font-size: 12px;
        color: #555;
        background: #f8f9fa;
        padding: 10px;
        border-radius: 8px;
        height: 60px;
        overflow-y: auto;
        margin-top: 10px;
        border: 1px solid #ddd;
        font-family: monospace;
      }

      .status-title { font-weight: bold; color: #333; margin-bottom: 5px; }

      #previewArea {
        display: flex;
        flex-direction: column;
        gap: 20px;
        margin-top: 30px;
        width: 100%;
        max-width: 800px;
      }
      
      .preview-card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .preview-title { font-weight: 600; margin-bottom: 15px; color: #333; word-break: break-all; }
      .image-comparison { display: flex; gap: 20px; width: 100%; justify-content: center; flex-wrap: wrap; }
      .image-box { display: flex; flex-direction: column; align-items: center; max-width: 300px; }
      .image-box p { margin: 0 0 5px 0; font-size: 13px; font-weight: bold; }

      .preview-image {
        max-width: 100%;
        max-height: 250px;
        border-radius: 8px;
        border: 1px solid #ddd;
        background-color: #f8f9fa;
        background-image: linear-gradient(45deg, #ccc 25%, transparent 25%), linear-gradient(-45deg, #ccc 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #ccc 75%), linear-gradient(-45deg, transparent 75%, #ccc 75%);
        background-size: 20px 20px;
        background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Hapus Background AI</h2>
      <p>Proses berjalan 100% di browsermu.</p>

      <div id="step1">
        <label for="fileInput" class="btn btn-primary" onclick="document.getElementById('fileInput').click()">1. Pilih Foto (Bisa Banyak)</label>
        <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFileSelection(event)">
        <div id="fileCount" class="info-text">Belum ada foto yang dipilih.</div>
        <div id="fileList"></div>
      </div>

      <div id="step2" style="display: none;">
        <button id="startBtn" class="btn btn-success" onclick="startProcessing()">2. Mulai Hapus Background</button>
      </div>

      <div id="progressContainer">
        <div id="statusTitle" class="status-title">Menyiapkan AI... (Harap bersabar, unduhan pertama butuh waktu)</div>
        <div id="progressLog">Menunggu dimulai...</div>
      </div>
    </div>

    <div id="previewArea"></div>

    <!-- MENGGUNAKAN VERSI 3 TERBARU DARI HUGGING FACE -->
    <script type="module">
      import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.0.0-alpha.12';
      
      env.allowLocalModels = false;
      env.useBrowserCache = true;

      window.globalSelectedFiles = [];
      let segmenter = null;

      window.handleFileSelection = function(event) {
        const fileInput = event.target;
        const fileCount = document.getElementById('fileCount');
        const fileList = document.getElementById('fileList');
        const step2 = document.getElementById('step2');
        const previewArea = document.getElementById('previewArea');
        
        window.globalSelectedFiles = Array.from(fileInput.files);
        previewArea.innerHTML = ''; 
        
        if (window.globalSelectedFiles.length > 0) {
          fileCount.innerHTML = `✅ Terpilih <b>${window.globalSelectedFiles.length}</b> foto.`;
          fileList.style.display = 'block';
          fileList.innerHTML = window.globalSelectedFiles.map(file => `<div class="file-item">📄 ${file.name}</div>`).join('');
          step2.style.display = 'block';
        } else {
          fileCount.innerHTML = 'Belum ada foto yang dipilih.';
          fileList.style.display = 'none';
          step2.style.display = 'none';
        }
      }

      function logProgress(msg) {
        const logBox = document.getElementById('progressLog');
        logBox.innerHTML += `<div>> ${msg}</div>`;
        logBox.scrollTop = logBox.scrollHeight;
      }

      window.startProcessing = async function() {
        if (!window.globalSelectedFiles || window.globalSelectedFiles.length === 0) return;

        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'none';
        const progressContainer = document.getElementById('progressContainer');
        progressContainer.style.display = 'block';
        
        const statusTitle = document.getElementById('statusTitle');
        document.getElementById('progressLog').innerHTML = '';

        try {
            if (!segmenter) {
                logProgress("Mengunduh model AI (RMBG-1.4)...");
                logProgress("Ukurannya ~40MB, hanya diunduh pada foto pertama.");
                
                segmenter = await pipeline('image-segmentation', 'briaai/RMBG-1.4', {
                    progress_callback: (info) => {
                        if (info.status === 'progress' && info.name) {
                            let percent = Math.round((info.loaded / info.total) * 100);
                            if(percent % 25 === 0) { 
                                logProgress(`Download ${info.name}: ${percent}%`);
                            }
                        } else if (info.status === 'done') {
                            logProgress(`Selesai download file.`);
                        }
                    }
                });
                logProgress("✅ Model AI berhasil dimuat!");
            }

            for (let i = 0; i < window.globalSelectedFiles.length; i++) {
                const file = window.globalSelectedFiles[i];
                logProgress(`Memproses foto (${i+1}/${window.globalSelectedFiles.length}): ${file.name}`);
                
                try {
                    const originalImageUrl = URL.createObjectURL(file);
                    logProgress("Sedang memotong background, tunggu sebentar...");
                    
                    // Eksekusi AI v3
                    const result = await segmenter(originalImageUrl);
                    
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const img = new Image();
                    img.src = originalImageUrl;
                    
                    await new Promise((resolve, reject) => {
                        img.onload = async () => {
                            canvas.width = img.width;
                            canvas.height = img.height;
                            ctx.drawImage(img, 0, 0);
                            
                            // Di v3, result bisa berupa array atau object langsung
                            let maskRawImage = result.mask || (result[0] ? result[0].mask : null); 
                            
                            if (!maskRawImage) {
                                reject(new Error("AI tidak mengenali objek di foto ini."));
                                return;
                            }

                            const maskImg = new Image();
                            maskImg.onload = () => {
                                const maskCanvas = document.createElement('canvas');
                                maskCanvas.width = canvas.width;
                                maskCanvas.height = canvas.height;
                                const maskCtx = maskCanvas.getContext('2d');
                                
                                maskCtx.drawImage(maskImg, 0, 0, canvas.width, canvas.height);
                                
                                ctx.globalCompositeOperation = 'destination-in';
                                ctx.drawImage(maskCanvas, 0, 0);
                                ctx.globalCompositeOperation = 'source-over';
                                
                                canvas.toBlob((blob) => {
                                    const resultImageUrl = URL.createObjectURL(blob);
                                    const originalName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
                                    const downloadFileName = originalName + '_nobg.png';

                                    const previewCard = document.createElement('div');
                                    previewCard.className = 'preview-card';
                                    previewCard.innerHTML = `
                                      <div class="preview-title">${file.name}</div>
                                      <div class="image-comparison">
                                        <div class="image-box">
                                          <p>Asli</p>
                                          <img src="${originalImageUrl}" class="preview-image" style="background-image: none; background-color: #fff;">
                                        </div>
                                        <div class="image-box">
                                          <p>Hasil</p>
                                          <img src="${resultImageUrl}" class="preview-image">
                                        </div>
                                      </div>
                                      <a href="${resultImageUrl}" download="${downloadFileName}" class="btn btn-download">⬇️ Unduh Gambar Ini</a>
                                    `;
                                    
                                    document.getElementById('previewArea').appendChild(previewCard);
                                    logProgress(`✅ Sukses: ${file.name}`);
                                    resolve();
                                }, 'image/png');
                            };
                            
                            // Mengekstrak mask di v3
                            try {
                                if (typeof maskRawImage === 'string') {
                                    maskImg.src = maskRawImage;
                                } else if (maskRawImage.toDataURL) {
                                    maskImg.src = await maskRawImage.toDataURL();
                                } else {
                                    // Fallback jika berupa objek PIL internal
                                    const maskCanvasInternal = document.createElement('canvas');
                                    maskCanvasInternal.width = maskRawImage.width;
                                    maskCanvasInternal.height = maskRawImage.height;
                                    const ctxInternal = maskCanvasInternal.getContext('2d');
                                    const imgData = new ImageData(
                                      new Uint8ClampedArray(maskRawImage.data), 
                                      maskRawImage.width, 
                                      maskRawImage.height
                                    );
                                    ctxInternal.putImageData(imgData, 0, 0);
                                    maskImg.src = maskCanvasInternal.toDataURL();
                                }
                            } catch (maskErr) {
                                reject(new Error("Gagal membaca hasil potongan AI."));
                            }
                        };
                    });

                } catch (err) {
                    logProgress(`❌ Gagal foto ${file.name}: ${err.message}`);
                }
            }

            statusTitle.innerHTML = `<span style="color: #198754; font-size:18px;">🎉 Semua proses selesai!</span>`;
            
        } catch (globalErr) {
            logProgress(`❌ ERROR FATAL: ${globalErr.message}`);
            statusTitle.innerHTML = `<span style="color: #dc3545; font-size:18px;">Gagal memuat AI. Refresh halaman.</span>`;
        }

        setTimeout(() => {
          document.getElementById('step1').style.display = 'block';
          document.getElementById('fileInput').value = '';
          window.globalSelectedFiles = []; 
        }, 2000);
      }
    </script>
  </body>
</html>
